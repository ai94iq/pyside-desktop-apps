# The skill's own checks, then a project scaffolded from the template on Linux, Windows and macOS: its
# tests offscreen, and its desktop bundle built and self-checked, exactly as a new project's CI would.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - run: python scripts/check_skill.py

  scaffold:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -q -U pip && python -m pip install -q PySide6-Essentials pytest
      - run: python scripts/new_project.py "Ci App" "$RUNNER_TEMP/ci-app"
      - working-directory: ${{ runner.temp }}/ci-app
        run: python -m pip install -q -e ".[dev]" && python -m pytest -q
      - working-directory: ${{ runner.temp }}/ci-app
        run: python packaging/build_bundle.py bundles && ls -l bundles
