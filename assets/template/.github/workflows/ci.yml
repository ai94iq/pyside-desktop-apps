# Tests offscreen on Linux, Windows and macOS on every push and pull request; every run also builds and
# self-checks the desktop bundles. A vX.Y.Z tag (equal to __version__) attaches them to a GitHub release.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -q -U pip && python -m pip install -q -e ".[dev]"
      - run: python -m pytest -q

  bundles:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python packaging/build_bundle.py bundles
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bundle-${{ matrix.os }}
          path: bundles/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, bundles]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach files to the GitHub release, this job only
    steps:
      - uses: actions/checkout@v7.0.1
      # The tag must equal the code's version, or the release holds mislabelled files.
      - run: |
          version=$(python3 -c 'import ast; t=open("src/__app__/__init__.py").read(); print([n.value.value for n in ast.parse(t).body if isinstance(n, ast.Assign) and getattr(n.targets[0], "id", "") == "__version__"][0])')
          test "v$version" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: bundle-*
          merge-multiple: true
          path: bundles
      - run: cd bundles && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: bundles/*
          body_path: packaging/release-notes.md
